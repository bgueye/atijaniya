    statusX: `Ce document s'appuie sur Jawâhir al-Ma'ânî, Munyat al-Murid et al-Durra al-Kharida de Cheikh al-Nazifi, complétés par des sources tidianes publiées en ligne. Il doit être relu et validé par un moqaddam référent avant toute diffusion. Ce n'est pas un avis religieux : en cas de doute, demandez à votre moqaddam.`,

        intro: `La réparation s'appelle le jabr. Elle se fait par 100 « Astaghfirou-llah » avec l'intention de réparer (niya jabr). Elle vaut pour le Lazim et pour la Wazifa, et les conditions du Lazim s'appliquent aussi à la Hadratou-l-Jouma.`,

          c(`Un pilier est oublié, ou deux piliers sont inversés (par exemple la Hailala avant la prière sur le Prophète ﷺ)`, `On fait ce qui manque, on refait la partie inversée à sa place (dans l'exemple, on refait la Hailala après la prière sur le Prophète ﷺ), puis on répare par 100 « Astaghfirou-llah ». Si l'inversion ou l'omission est volontaire, le wird est nul et doit être refait.`, `al-Durra al-Kharida, t. 4, p. 9 ; Zawiya.sn ; Tidjaniya.com (AR)`),
          c(`Des répétitions en trop, par oubli`, `100 « Astaghfirou-llah » avec l'intention de réparer. S'il manque aussi quelque chose, on le complète d'abord. Si l'ajout est volontaire, c'est un manque d'adab ; les avis divergent sur sa nullité (voir l'annexe).`, `al-Durra al-Kharida, t. 4, p. 9 ; Zawiya.sn`),
          c(`Absence de présence du cœur (houdour)`, `Après l'acte, on récite 3 fois « Djaouharatou-l-Kamel » avec l'intention de réparer, avec toute la présence possible. Al-Durra range aussi le défaut de présence parmi les manques que l'on répare dans la Wazifa.`, `Kibriyatoul Ahmar ; Zawiya.sn ; al-Durra al-Kharida, t. 4, p. 32`),
          c(`Doute ou oubli concernant la réparation elle-même`, `On ne la recommence pas.`, `al-Durra al-Kharida, t. 4, p. 9 ; Zawiya.sn`),
          c(`Perles manquantes ou en trop sur le chapelet, nombre de jours connu`, `Le rattrapage des jours concernés est nécessaire.`, `Zawiya.sn`),
          c(`Perles manquantes ou en trop sur le chapelet, nombre de jours inconnu`, `Si des perles manquaient : on rattrape seulement le Lazim de la dernière journée. Si des perles étaient en trop : 100 « Astaghfirou-llah » avec l'intention de réparer, pour toute la période. Certains prescrivent 600 « Astaghfirou-llah » et 3 « Djaouharatou-l-Kamel ».`, `Hajj Hassan Ba'qili, Al-Ira'a, cité par Zawiya.sn`),
          c(`On arrive en cours de récitation collective`, `On commence avec le groupe là où il en est. Si on le rejoint au milieu d'une répétition, on la termine avec lui sans la compter. Quand le groupe a fini les piliers, on rattrape aussitôt ce qu'on a manqué, dans l'ordre, avant les invocations.`, `al-Durra al-Kharida, t. 4, p. 34-35 ; Tidjaniya.com (AR)`)

        cases: [
          c(`Lazim oublié ou manqué`, `Il se rattrape, et sans tarder : « فليقض عاجلاً ». Le rattrapage s'impose parce que le Lazim est devenu obligatoire par l'engagement, comme un vœu. Jawâhir : « Celui qui a délaissé le wird doit le rattraper. » Dans sa lettre aux disciples de Guemar, Seïdina Ahmed Tijani écrit que celui qui l'a dépassé à cause du travail, de la maladie ou d'une cause semblable le rattrape à n'importe quel moment de la nuit qui lui est possible.`, `Jawâhir al-Ma'ânî (éd. Kanûn), p. 255 ; al-Durra al-Kharida, t. 4, p. 10-11 ; Tidjaniya.com ; Zawiya.sn (Q.69)`),
          c(`Femme en période de menstrues ou de lochies, malade alité trop faible`, `Elles et lui ont le choix de faire le wird ou non, et n'ont pas à le rattraper une fois purifiées ou guéri. Le malade concerné est celui qui ne peut le faire qu'avec une vraie peine ; un malade légèrement atteint n'est pas concerné.`, `al-Durra al-Kharida, t. 4, p. 15 ; Tidjaniya.com (FR)`),

          c(`Soir commencé après le Maghreb, et on s'aperçoit qu'on n'a pas fait le matin`, `On termine le soir, puis on rattrape le matin.`, `al-Durra al-Kharida, t. 4, p. 20 ; Tidjaniya.com (Cheikh Nadhifi)`),
          c(`L'aube se lève pendant un matin avancé`, `On le termine, puis on le refait après le Soubh ; le premier compte alors comme surérogatoire.`, `al-Durra al-Kharida, t. 4, p. 14 ; Tidjaniya.com`),
          c(`Parler pendant le Lazim`, `C'est interdit, sauf nécessité, et alors par signes si possible. Exceptions : répondre à un parent, une épouse à son mari, un disciple à son moqaddam ou à son cheikh. Rendre le salut est obligatoire, par la parole ou par un geste ; répéter l'appel à la prière et bénir celui qui éternue sont recommandés.`, `al-Durra al-Kharida, t. 4, p. 24 ; Tidjaniya.com (EN) ; Tijani Flood`),

          c(`Perte des ablutions (ou du tayammum) en cours de route`, `Le dhikr est annulé et on le reprend, car la pureté est une condition de validité.`, `Tidjania.ma (Q.1, Q.5)`),
          c(`Sommeil, chute du chapelet`, `Un sommeil profond annule les ablutions, donc le dhikr. Si l'on se réveille avec la chute du chapelet, rien n'est annulé et on construit sur ce dont on est sûr.`, `Tidjania.ma (Q.15, Q.32)`),

          c(`انتقاض الوضوء أو التيمم أثناء الذكر`, `يبطل الذكر ويُستأنف العمل، لأن الطهارة شرط صحة.`, `الأجوبة الشافية (س١، س٥)`),
          c(`النوم وسقوط السبحة`, `النوم الثقيل ينقض الوضوء فيبطل الذكر. وإن استيقظ مع سقوط السبحة فلا يبطل، ويبني على اليقين.`, `الأجوبة الشافية (س١٥، س٣٢)`),
          c(`القيام ناسيا`, `إن كان قصيرا جلس وأكمل، وإن طال استأنف.`, `الأجوبة الشافية (س١٤)`),
          c(`أقيمت الصلاة المفروضة وهو في ورده`, `يحصي عدد ما قرأ، ويصلي مع الإمام، ثم يبني بعد السلام على ما مضى قبل أذكار ما بعد الصلاة، ولا يستأنف. ونقلت الدرة هذا عن الإفادة وقالت إنه صحيح متواتر عن الشيخ. والتراويح والنوافل لا تقطع الورد اللازم.`, `الدرة الخريدة، ج٤، ص١٩-٢٠؛ كبريات الأحمر؛ الأجوبة الشافية (س٤٠)`),
          c(`افتتح الإخوان الوظيفة وهو في ورده`, `لا يقطع ورده ليدخل معهم، فإن قطعه جهلا فقد أساء وليعده.`, `الدرة الخريدة، ج٤، ص١٩`),
          c(`دخل الخطيب يوم الجمعة وهو في ورده`, `يتم ورده، ولا يقطعه للخطبة، وإنما يقطعه للصلاة.`, `الدرة الخريدة، ج٤، ص٢٠`),
          c(`تذكر أثناء الورد أنه لم يصلِّ`, `يتم الورد عموما ثم يصلي. أما صلاة الصبح أو العصر المنسية فيقطع الورد وجوبا ليصليها أولا.`, `الأجوبة الشافية (س٣)`),
          c(`فوات حبة أو حبتين (بتثاؤب أو سعال)`, `لا يتركها في ذمته، بل يأتي بها سرا ثم يلحق الجماعة.`, `الأجوبة الشافية (س٣٦، س٦٠)`)
        ],
        warn: `<b>تحذيرات الحاج حسن بعقيلي.</b> إذا قُرئ اللازم قبل وقته فهو باطل. وإذا قُرئ في وقت الضرورة بلا عذر فهو خطأ كبير في الطريقة. وإذا قُرئ بعد وقته فهو سوء أدب ومخالفة لأمر الشيخ.` },
      { id: `s3`, n: `٣`, nav: `الوظيفة`, h: `الوظيفة`,
        intro: `الوظيفة لازمة للطريقة، وتكفي في وقت واحد صباحا أو مساء، وإن تيسر الوقتان فحسن. وشروط صحتها وكمالها شروط الورد. ومن كان له إخوان في البلد قرأها معهم جماعة، ومن كان وحده قرأها وحده.`,
        timing: [
          [`الوقت`, `مرة واحدة على الأقل في اليوم والليلة، وقراءتها مرتين صباحا ومساء بمواقيت اللازم أفضل. وإن قُرئت مرة واحدة فوقتها من العصر إلى عصر اليوم التالي، وعند العذر إلى مغرب اليوم التالي. ومن اكتفى بمرة في الليل أجزأه، وعليه استمر عمل جيرة الشيخ بفاس.`]
        ],
        cases: [
          c(`فوات الوظيفة أو نسيانها`, `تُقضى كاللازم، لأنها صارت واجبة بالالتزام. وفي الجواهر: «ومن ترك الوظيفة فالقضاء عليه أيضا».`, `جواهر المعاني (تحقيق كنون)، ص٢٥٥؛ منية المريد، ص١٨؛ الدرة الخريدة، ج٤، ص٣٢، ٣٥`),
          c(`العذر: المرض والحيض والنفاس`, `لا قضاء إن فاتت لأحد هذه الأعذار، ويُستحب القضاء إن كان المرض خفيفا. وإن برئ المريض في وقتها أتى بها.`, `الدرة الخريدة، ج٤، ص٣٢؛ الأجوبة الشافية (س٥٧)`),
          c(`الخطأ في العدد أو الترتيب، وخلوّها من الحضور`, `يُجبر كاللازم (القسم ١).`, `الدرة الخريدة، ج٤، ص٣٢`),
          c(`يوم الجمعة، وخشي أن تُفوِّت الوظيفةُ حضرة الجمعة`, `يقطع الوظيفة، ويأتي بحضرة الجمعة إلى المغرب، ثم يتم الوظيفة منفردا بعد الصلاة دون أن يبدأ أذكار ما بعد الصلاة.`, `موقع الزاوية التجانية (الشيخ أحمد التجاني الشنقيطي، س٧٠)`),
          c(`قراءة صلاة أخرى على النبي ﷺ أثناء الوظيفة`, `تبطل الوظيفة.`, `tidjaniya.com (بالإنجليزية)، عن سيدي العربي بن السائح`),
          c(`الأكل أو الشرب أثناء الوظيفة`, `كاللازم: لا يقطعها لذلك.`, `الدرة الخريدة، ج٤، ص٢٠؛ tidjaniya.com (بالإنجليزية)`),
          c(`فقدان شروط جوهرة الكمال (الطهارة المائية، طهارة المكان، الجلوس)`, `يقرأ عشرين صلاة الفاتح بدل الجوهرة. وفي الجواهر: «ولا تُقرأ جوهرة الكمال إلا بالطهارة المائية لا بالترابية، لأن النبي ﷺ يحضر عند قراءتها». ويُندب نشر إزار نظيف طاهر لها. وكذلك من لم يحفظ الجوهرة.`, `جواهر المعاني (تحقيق كنون)، ص٢٥٥-٢٥٦؛ منية المريد، ص١٧؛ الدرة الخريدة، ج٤، ص٣٦؛ tidjaniya.com`),
          c(`المسافر على الدابة`, `ينزل ويقرأ الجوهرة راجلا على أرض طاهرة، ثم يجلس عند السابعة. فإن تعذر ذلك قرأ عشرين صلاة الفاتح.`, `منية المريد، ص١٧؛ tidjaniya.com (ع)`)
        ] },
      { id: `s4`, n: `٤`, nav: `حضرة الجمعة`, h: `حضرة الجمعة`,
        intro: `عدّها صاحب الجواهر من الأوراد اللازمة للطريقة، تُذكر جماعة إن كان للمريد إخوان في البلد، ووحده إن لم يكن. وشروطها شروط الورد. وإذا فات وقتها فلا تُقضى على المعتمد.`,
        timing: [
          [`الوقت`, `يوم الجمعة فقط، بعد صلاة العصر، متصلة بالغروب. ومن لم يقدر على الابتداء بعد العصر أخّرها حتى يبقى بينه وبين الغروب نحو ساعة ونصف.`],
          [`العدد`, `ألف فصاعدا على الصحيح، والعمل جار إلى ألف وستمائة. ولم يحدد صاحب الجواهر عددا: «من غير حد ولا حصر».`]
        ],
        cases: [
          c(`فات الوقت`, `لا تُقضى، لفوات نكتتها وثمرتها، وهي ساعة الإجابة في آخر ساعة من يوم الجمعة. واستحسن سيدي محمد أكنسوس قضاءها لأنها صارت بالنذر مثل الورد والوظيفة.`, `الدرة الخريدة، ج٤، ص١٠٦-١٠٧؛ منية المريد، ص١٩؛ موقع الزاوية التجانية (س٦٩)؛ الأجوبة الشافية (س٥١)`),
          c(`النسيان أو الاشتغال بضرورة`, `لا حرج عليه، لكن يفوته خير كثير: حضور سيد الوجود ﷺ مع الذاكرين في ذلك الوقت.`, `الدرة الخريدة، ج٤، ص١٠٧؛ الأجوبة الشافية (س٥٣)`),
          c(`التفويت تهاونا بلا عذر`, `قال سيدنا أحمد التجاني إن المريد فاته خير عظيم لا يستطيع تداركه: «وتركها يفيت خيرا جما».`, `منية المريد، ص١٩؛ موقع الزاوية التجانية؛ tidjaniya.com (بالإنجليزية)`),
          c(`دخل مع الإخوان في الهيللة وهو يظنها الوظيفة`, `يعيد الهيللة، لفقد النية وهي من شروط الصحة.`, `الدرة الخريدة، ج٤، ص١٠٦`),
          c(`المريض`, `إن برئ في وقتها أتى بها. وإن عجز عن الذكر بسبب المرض سقطت عنه.`, `الأجوبة الشافية (س٥٧)`),
          c(`السفر يوم الجمعة`, `إن رجا أن يدرك الوقت في منزله أخّرها، وإن خاف خروج الوقت ذكر بما أمكن.`, `الأجوبة الشافية (س٥٨)`)
        ] },
      { id: `s5`, n: `٥`, nav: `سؤال المقدَّم`, h: `ما لم تحسمه المصادر`,
        intro: `هذه المسائل لم تُفصَّل في المصادر التي اطلعنا عليها، أو اختلفت فيها الأقوال. اسأل مقدَّمك.`,
        list: [
          `تراكم أيام فائتة كثيرة: تأمر المصادر بالقضاء عاجلا، ولم تبيّن كيفية توزيع أيام كثيرة.`,
          `الزيادة العمدية في العدد: سوء أدب عند بعضهم، ومبطلة عند آخرين.`,
          `انقطاع حضرة الجمعة في أثنائها.`,
          `قضاء حضرة الجمعة الفائتة، إذ استحسنه بعضهم.`,
          `اختلاف الممارسة بين الزوايا.`
        ] }
    ],
    annexT: `ملحق عمل`,
    annexNote: `يُحذف قبل أي نشر داخل التطبيق.`,
    annexH: `نقاط تحتاج إلى مراجعة`,
    annex: [
      `الأحكام المعزوّة إلى جواهر المعاني ومنية المريد والدرة الخريدة قُرئت في صفحات هذه الكتب: الجواهر في تحقيق كنون، والمنية والدرة (ج٤) في النسخ المصوَّرة الواردة (بترقيم الطبعة). والباقي من مواقع تنقل عن الإفادة والإراءة والبغية، ولم نطلع عليها مباشرة.`,
      `الزيادة عمدا (الدرة، ج٤، ص٩): عند أبي المواهب السائحي يبطل الورد قياسا على الصلاة، وعند النظيفي هي سوء أدب لا تُلزم الإعادة، لأن الورد ليس كالصلاة في كل شيء. أما النقص عمدا فمبطل.`,
      `نهاية وقت الضرورة للازم الصباح: «غروب الشمس» و«المغرب» بمعنى واحد؛ وفي الدرة (ج٤، ص١٠): «إلى المغرب وهو غروب الشمس».`,
      `استثناء الحائض والمريض: ثابت في الدرة (ج٤، ص١٥) مع النفساء، وكذلك في الوظيفة (ج٤، ص٣٢).`,
      `طلوع الفجر أثناء ورد الصباح المقدَّم (الدرة، ج٤، ص١٤): في الإفادة يتمه ويعتد به، وفي الرماح يعيده؛ ووفّق بعضهم بأن يتمه ثم يعيده بعد الصبح، وقالت الدرة: «وهو توفيق حسن».`,
      `الأكل أثناء الورد (الدرة، ج٤، ص٢٠): نُقل التساهل في الخفيف دون استئناف، وخصّ صاحب الرماح المنع بالورد المطلق، والمعتمد المنع في اللازم والوظيفة والهيللة.`,
      `قضاء الوظيفة: ذكرت الدرة (ج٤، ص٣٥) أن في بعض نسخ الجواهر وبعض الإجازات عدم لزوم قضائها، وهو القول المرجوع عنه، وأن مؤلف الجواهر أصلح النسخة بيده بما هو صريح في لزوم القضاء كالورد.`,
      `قضاء حضرة الجمعة (الدرة، ج٤، ص١٠٧): قال سيدي محمد أكنسوس: «والصواب قضاؤه»، خلافا للمعتمد. وفي العدد: الدرة «ألف فصاعدا»، والجواهر (ص٢٥٦) «من غير حد ولا حصر»، وقسم الأوراد في التطبيق يحدد ١٦٠٠. يجب التوحيد.`,
      `ربطت الدرة (ج٤، ص١٠٦-١٠٧) وقت الهيللة صراحة بساعة الإجابة في آخر يوم الجمعة.`,
      `الوظيفة وحضرة الجمعة (س٧٠): النص الذي اطلعنا عليه يكتب «العصرو»، وقد فُهم هنا بمعنى حضرة الجمعة.`,
      `التأخر عن الحضرة (س٧٢): العبارة غير واضحة في الإكمال إلى ألف، ولم تُدرج في المتن.`,
      `النصوص الفرنسية والعربية إعادة صياغة. يجب أن يراجع النص العربي مختص بالعربية قبل النشر.`
    ],
    srcH: `المصادر المطلع عليها`
  };

  function esc(s) { return s; }

  function render(L, root) {
    var h = '';
    h += '<header class="hero"><h1>' + L.title + '</h1><p class="sub">' + L.sub + '</p>';
    h += '<div class="status" role="note"><b>' + L.statusT + '</b><span>' + L.statusX + '</span></div>';
    h += '<ul class="jump">';
    L.sections.forEach(function (s) { h += '<li><a href="#' + root.id + '-' + s.id + '">' + s.nav + '</a></li>'; });
    h += '<li><a href="#' + root.id + '-annex">' + L.annexT + '</a></li></ul></header>';

    h += '<section class="blk"><h2 class="sec">' + L.glanceT + '</h2><div class="tablewrap"><table class="glance"><thead><tr>';
    L.glanceHead.forEach(function (t) { h += '<th scope="col">' + t + '</th>'; });
    h += '</tr></thead><tbody>';
    L.glance.forEach(function (r) {
      h += '<tr><th scope="row">' + r[0] + '</th><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>';
    });
    h += '</tbody></table></div></section>';

    L.sections.forEach(function (s) {
      h += '<section class="blk" id="' + root.id + '-' + s.id + '"><h2 class="sec"><span class="n">' + s.n + '</span>' + s.h + '</h2>';
      h += '<p class="intro">' + s.intro + '</p>';
      if (s.timing) {
        h += '<dl class="timing">';
        s.timing.forEach(function (t) { h += '<dt>' + t[0] + '</dt><dd>' + t[1] + '</dd>'; });
        h += '</dl>';
      }
      if (s.cases) {
        h += '<div class="cases">';
        s.cases.forEach(function (k) {
          h += '<div class="case"><div class="q">' + k.q + '</div><div class="a"><p>' + k.a + '</p><span class="src">' + k.s + '</span></div></div>';
        });
        h += '</div>';
      }
      if (s.warn) h += '<div class="warn">' + s.warn + '</div>';
      if (s.list) {
        h += '<ul class="ask">';
        s.list.forEach(function (t) { h += '<li>' + t + '</li>'; });
        h += '</ul>';
      }
      h += '</section>';
    });

    h += '<section class="blk" id="' + root.id + '-annex"><div class="annex"><h2 class="sec">' + L.annexT + '</h2><p class="intro">' + L.annexNote + '</p>';
    h += '<h3>' + L.annexH + '</h3><ol>';
    L.annex.forEach(function (t) { h += '<li>' + t + '</li>'; });
    h += '</ol><h3>' + L.srcH + '</h3><ul class="sources">';
    SOURCES.forEach(function (s) { h += '<li><a href="' + s.u + '" target="_blank" rel="noopener noreferrer">' + s.t + '</a></li>'; });
    h += '</ul></div></section>';
    root.innerHTML = h;
  }

  var frEl = document.getElementById('fr'), arEl = document.getElementById('ar');
  var bFr = document.getElementById('btn-fr'), bAr = document.getElementById('btn-ar');
  render(FR, frEl); render(AR, arEl);

  function show(lang) {
    var isAr = lang === 'ar';
    frEl.hidden = isAr; arEl.hidden = !isAr;
    bFr.setAttribute('aria-pressed', String(!isAr));
    bAr.setAttribute('aria-pressed', String(isAr));
    window.scrollTo(0, 0);
  }
  bFr.addEventListener('click', function () { show('fr'); });
  bAr.addEventListener('click', function () { show('ar'); });
  if (/^#ar/.test(location.hash)) show('ar');
})();
</script>
