# At-Tijaniya — design tokens
# Source unique de vérité pour les couleurs et typographies. Toute implémentation
# (Flutter ThemeData, composants) doit référencer ces valeurs plutôt que redéfinir
# des couleurs en dur.

colors:
  zaytoune:
    hex: "#0F3D2E"
    usage: "Fonds immersifs, écrans de wird, en-têtes"
  emerald:
    hex: "#1C6E4A"
    usage: "Actions principales, états actifs"
  gold:
    hex: "#C9A24B"
    usage: "Accents, filets, éléments précieux"
  gold_soft:
    hex: "#F1E6C9"
    usage: "Fonds doux d'accent, badges"
  parchment:
    hex: "#F7F2E7"
    usage: "Fond principal, écrans de lecture"
  emerald_soft:
    hex: "#E4EEE8"
    usage: "Fonds doux d'accent sur zones claires"
  ink:
    hex: "#2B2620"
    usage: "Texte principal"
  bronze:
    hex: "#8C7A5B"
    usage: "Texte secondaire, bordures, légendes"
  off_white:
    hex: "#FFFDF8"
    usage: "Cartes, surfaces sur fond ivoire"

typography:
  titles_fr:
    font_family: "Cormorant Garamond"
    weights: [500, 600]
    usage: "H1, H2, noms de figures. Jamais en texte courant."
  sacred_and_arabic_titles:
    font_family: "Amiri"
    weights: [400, 700]
    usage: "Textes religieux, noms propres arabes, titres de sections. JAMAIS pour les libellés d'interface génériques (boutons, menus)."
  ui:
    font_family: "Jost"
    weights: [300, 400, 500, 600]
    usage: "Boutons, menus, labels, corps de texte d'interface."

iconography:
  signature_motif: "rosace à huit branches"
  rule: "Une seule occurrence par écran, filigrane à faible opacité ou trait fin. Jamais en pattern répété."

logo:
  concept: "Sceau-rosace — rosace à huit branches encadrant le nom التجانية en calligraphie arabe, double cercle"
  variants:
    - name: "fond_clair"
      file: "assets/branding/logo-fond-clair-1024.png"
      usage: "Documents, listing stores, supports imprimés"
    - name: "fond_sombre"
      file: "assets/branding/logo-fond-sombre.svg"
      usage: "Splash screen, en-têtes"
    - name: "icone_app"
      file: "à produire en Phase 1 (rosace dorée seule, sans texte, fond zaytoune)"
      usage: "Icône de lanceur Android/iOS"
  text_visibility_rule: "Le texte arabe intégré au logo est retiré en dessous de ~60px d'affichage ; seule la rosace reste."

accessibility:
  contrast_zaytoune_on_parchment: "> 7:1 (vérifié)"
  high_contrast_mode:
    status: "implémenté (Sprint 3, 2026-08-21) — réglage opt-in dans Paramètres, persisté"
    rationale: >
      Audit WCAG (formule de contraste officielle, sur les couleurs sRGB
      exactes ci-dessus) : bronze sur parchemin ne passe PAS le seuil AA
      texte normal (3,72:1 mesuré, seuil 4,5:1) — ni sur off_white (4,09:1).
      Gold utilisé comme texte est pire (2,15:1 sur parchemin). Emerald
      passe l'AA (5,57:1) mais pas l'AAA (7:1). Ink et les fonds
      (parchment/off_white/gold_soft/emerald_soft) ne sont pas concernés,
      déjà largement conformes (ink sur parchment ≈13,4:1).
    scope: >
      Seules bronze/emerald/gold deviennent dynamiques (accentuées en mode
      renforcé) ; ink et les fonds restent inchangés — objectif "renforcer"
      le texte/les bordures existants, pas remplacer la charte par un
      noir/blanc pur qui durcirait la lecture pour le public visé
      (utilisateurs âgés sur fond parchemin).
    values:
      bronze_high_contrast:
        hex: "#4A3F2E"
        contrast_on_parchment: "9,22:1 (AAA)"
        contrast_on_off_white: "10,12:1 (AAA)"
      emerald_high_contrast:
        hex: "#0F4A32"
        contrast_on_parchment: "9,19:1 (AAA)"
        note: "Distinct de zaytoune (#0F3D2E, déjà un autre rôle sémantique) pour ne pas dupliquer un token existant sous un autre nom."
      gold_high_contrast:
        hex: "#8A6A1E"
        contrast_on_parchment: "4,52:1 (AA)"
        note: "Reste perceptiblement doré (AAA ferait virer au brun et perdrait l'identité de la couleur) ; gold reste un accent, rarement du texte de lecture longue."
