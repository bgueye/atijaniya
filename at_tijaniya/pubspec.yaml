name: at_tijaniya
description: "At-Tijaniya — compagnon numérique du disciple tijani (wirds, khadara, figures, communauté)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # version fixée automatiquement par flutter_localizations lors du `flutter pub get`

  # État global (langue, session…)
  flutter_riverpod: ^2.5.1
  # Navigation : Navigator standard pour ce squelette de démarrage. À
  # remplacer par go_router en Phase 3 si des deep links (invitations de
  # parrainage, liens de direct Khadara...) sont nécessaires.

  # Backend
  supabase_flutter: ^2.5.6

  # Typographie (Jost / Amiri / Cormorant Garamond servies via Google Fonts,
  # évite de devoir committer les fichiers de police manuellement en Phase 2 ;
  # à réévaluer en Phase 5 — bundler les .ttf en assets pour fiabilité hors-ligne
  # avant publication sur les stores).
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8
  speech_to_text: ^7.4.0
  shared_preferences: ^2.5.5
  # Lecteur audio du Wird (docs/03-architecture-ecrans.md) : lecture des
  # récitations modèles depuis le bucket Supabase Storage `wird-audio`
  # (docs/06-architecture-backend.md) une fois produites.
  just_audio: ^0.9.40
  # Rappels/notifications du Wird (docs/03-architecture-ecrans.md). Heure
  # choisie par le disciple lui-même (voir commentaire dans
  # `wird_reminder_slots.dart` sur le choix de ne pas calculer les horaires
  # de prière automatiquement en V1).
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  # Calendrier Khadara / annuaire des zawiyas (docs/03-architecture-ecrans.md) :
  # ouvre l'app de plans du téléphone sur les coordonnées d'un évènement ou
  # d'une zawiya — pas de carte intégrée en V1 (décision : voir
  # `khadara_screen.dart`).
  url_launcher: ^6.3.1
  # Écran "À propos" des Paramètres généraux (docs/03-architecture-ecrans.md) :
  # lit le numéro de version déclaré dans pubspec.yaml à l'exécution, plutôt
  # que de le dupliquer en dur dans le code.
  package_info_plus: ^8.0.0
  # Rendu du logo Sceau-rosace (assets/branding/logo-fond-sombre.svg) sur
  # l'écran de démarrage — Image.asset ne rend pas nativement le SVG.
  flutter_svg: ^2.3.0
  # Messagerie privée (docs/03-architecture-ecrans.md) : génère l'id d'une
  # nouvelle conversation côté client avant l'insertion, pour ne jamais avoir
  # à relire la ligne via RETURNING avant d'y être soi-même participant (la
  # policy SELECT de `conversations` exige déjà d'être participant) — voir
  # `messages_repository.dart`. Déjà résolue en dépendance transitive
  # (supabase_flutter/gotrue), déclarée ici explicitement.
  uuid: ^4.6.0
  # Carte de partage de la silsila d'ijaza (docs/08-spec-animation-silsila.md
  # §7) : capture d'un widget hors-écran en PNG (path_provider, dossier
  # temporaire) puis ouverture de la feuille de partage native (share_plus).
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  # Sélection d'une image (galerie ou appareil photo) pour l'image de
  # couverture d'un évènement Khadara, le portrait d'une figure et une
  # publication du fil communautaire — téléversée ensuite vers Supabase
  # Storage (`lib/core/storage/image_upload_service.dart`).
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # active flutter gen-l10n à partir de lib/l10n/*.arb + l10n.yaml

  assets:
    - assets/branding/
    - assets/audio/manifest.json
    - assets/audio/wirds/
